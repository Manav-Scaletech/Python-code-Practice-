<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Channels Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 16px;
            background: #f7f7f7;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        #messages {
            min-height: 180px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin: 16px 0;
            background: #fafafa;
            white-space: pre-wrap;
        }
        input, button {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Django Channels Demo</h1>
        <p>This page opens a WebSocket connection to <code>/ws/chat/</code>.</p>

        <div id="messages"></div>

        <input id="message-input" type="text" placeholder="Type a message">
        <button id="send-button">Send</button>
    </div>

    <script>
        const messages = document.getElementById("messages");
        const input = document.getElementById("message-input");
        const button = document.getElementById("send-button");

        const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsScheme}://${window.location.host}/ws/chat/`);

        socket.onopen = () => {
            messages.textContent += "WebSocket connected.\n";
        };

        socket.onmessage = (event) => {
            messages.textContent += event.data + "\n";
        };

        socket.onclose = () => {
            messages.textContent += "WebSocket disconnected.\n";
        };

        button.addEventListener("click", () => {
            if (input.value.trim()) {
                socket.send(input.value);
                input.value = "";
            }
        });
    </script>
</body>
</html>
