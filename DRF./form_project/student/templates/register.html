<!DOCTYPE html>

<html>

<head>

    <title>Registration</title>

</head>

<body>

    <h2>Student Registration</h2>

    {% if message %}

    <p>{{ message }}</p>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">

            Register

        </button>

    </form>

</body>

</html>
