<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Contact Form</title>
</head>

<body>

    <h2>Contact Us</h2>

    <!-- The form tag wraps all input fields -->
    <form action="/submit-form-endpoint" method="POST">

        <!-- Name Input Area -->
        <p>
            <label for="userName">Name:</label>
            <input type="text" id="userName" name="name" required placeholder="Enter your name">
        </p>

        <!-- Email Input Area -->
        <p>
            <label for="userEmail">Email:</label>
            <input type="email" id="userEmail" name="email" required placeholder="Enter your email">
        </p>

        <!-- Submit Button -->
        <p>
            <button type="submit">Submit Form</button>
        </p>

    </form>

</body>

</html>
